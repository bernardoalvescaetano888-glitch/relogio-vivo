name: Gerar executáveis

# Roda manualmente (Actions > Gerar executáveis > Run workflow) ou ao criar
# uma tag "v*". Cada sistema compila o seu próprio binário, porque o
# PyInstaller não faz compilação cruzada.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 (exe + instalador)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install --upgrade pyinstaller "Pillow>=10.0"

      - name: Compilar
        run: >
          python -m PyInstaller --noconfirm --windowed --onefile
          --name RelogioVivo-win-x64
          --icon assets/icon.ico
          --version-file assets/version_info.txt
          --exclude-module numpy --exclude-module pygame
          --exclude-module psutil --exclude-module setuptools
          --exclude-module pip --exclude-module pytest
          --exclude-module unittest --exclude-module pydoc
          --exclude-module doctest --exclude-module lib2to3
          --exclude-module pdb --exclude-module tkinter.test
          relogio_vivo.py

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Gerar instalador .exe
        shell: pwsh
        run: ./installer/windows/build_setup.ps1 -Arch x64

      - uses: actions/upload-artifact@v4
        with:
          name: RelogioVivo-win-x64
          path: |
            dist/RelogioVivo-win-x64.exe
            dist/RelogioVivo-Setup-*-win-x64.exe
          if-no-files-found: error

  windows-arm64:
    name: Windows ARM64 (exe + instalador)
    runs-on: windows-11-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install --upgrade pyinstaller "Pillow>=10.0"

      - name: Compilar
        run: >
          python -m PyInstaller --noconfirm --windowed --onefile
          --name RelogioVivo-win-arm64
          --icon assets/icon.ico
          --version-file assets/version_info.txt
          --exclude-module numpy --exclude-module pygame
          --exclude-module psutil --exclude-module setuptools
          --exclude-module pip --exclude-module pytest
          --exclude-module unittest --exclude-module pydoc
          --exclude-module doctest --exclude-module lib2to3
          --exclude-module pdb --exclude-module tkinter.test
          relogio_vivo.py

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Gerar instalador .exe
        shell: pwsh
        run: ./installer/windows/build_setup.ps1 -Arch arm64

      - uses: actions/upload-artifact@v4
        with:
          name: RelogioVivo-win-arm64
          path: |
            dist/RelogioVivo-win-arm64.exe
            dist/RelogioVivo-Setup-*-win-arm64.exe
          if-no-files-found: error

  linux:
    name: Linux x64 (binário + .tar.gz + .deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python, Tk e dependências de build
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-tk python3-pil imagemagick

      - name: Compilar
        run: bash build_linux.sh

      - name: Empacotar (preserva o chmod +x)
        run: |
          chmod +x dist/RelogioVivo-linux-*
          cd dist
          for f in RelogioVivo-linux-*; do
            tar -czf "$f.tar.gz" "$f"
          done
          ls -lh

      - name: Gerar pacote .deb
        run: bash installer/linux/build_deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: RelogioVivo-linux-x64
          path: |
            dist/RelogioVivo-linux-*.tar.gz
            dist/RelogioVivo-linux-x64
            dist/relogio-vivo_*_all.deb
          if-no-files-found: error

  linux-arm64:
    name: Linux ARM64 (binário + .tar.gz)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python, Tk e dependências de build
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-tk python3-pil

      - name: Compilar
        run: bash build_linux.sh

      - name: Empacotar (preserva o chmod +x)
        run: |
          chmod +x dist/RelogioVivo-linux-arm64
          cd dist
          tar -czf RelogioVivo-linux-arm64.tar.gz RelogioVivo-linux-arm64
          ls -lh RelogioVivo-linux-arm64*

      - uses: actions/upload-artifact@v4
        with:
          name: RelogioVivo-linux-arm64
          path: dist/RelogioVivo-linux-arm64.tar.gz
          if-no-files-found: error

  macos:
    name: macOS arm64 (app + .pkg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar
        run: bash build_macos.sh

      - name: Empacotar .app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent RelogioVivo.app RelogioVivo-macos-arm64.zip

      - name: Gerar instalador .pkg
        run: bash installer/macos/build_pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: RelogioVivo-macos-arm64
          path: |
            dist/RelogioVivo-macos-arm64.zip
            dist/RelogioVivo-Setup-*-macos-arm64.pkg
          if-no-files-found: error

  macos-intel:
    name: macOS Intel (app + .pkg)
    runs-on: macos-15-intel
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar
        run: bash build_macos.sh

      - name: Empacotar .app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent RelogioVivo.app RelogioVivo-macos-x64.zip

      - name: Gerar instalador .pkg
        run: bash installer/macos/build_pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: RelogioVivo-macos-x64
          path: |
            dist/RelogioVivo-macos-x64.zip
            dist/RelogioVivo-Setup-*-macos-x64.pkg
          if-no-files-found: error

  release:
    name: Publicar na release
    if: startsWith(github.ref, 'refs/tags/') && always()
    # needs completo para os ZIPs saírem completos. O always() evita que a
    # release seja cancelada se um runner ARM não estiver disponível; nesse
    # caso os ZIPs são refeitos localmente e enviados com --clobber.
    needs: [windows, windows-arm64, linux, linux-arm64, macos, macos-intel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Montar os ZIPs (install e portátil)
        run: python3 installer/make_bundle.py

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/install.zip
            dist/portatil.zip
          fail_on_unmatched_files: true
