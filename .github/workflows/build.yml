name: Gerar executáveis

# Roda manualmente (Actions > Gerar executáveis > Run workflow) ou ao criar
# uma tag "v*". Cada sistema compila o seu próprio binário, porque o
# PyInstaller não faz compilação cruzada.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install --upgrade pyinstaller "Pillow>=10.0"

      - name: Compilar
        run: >
          python -m PyInstaller --noconfirm --windowed --onefile
          --name RelogioVivo-win-x64
          --exclude-module numpy --exclude-module pygame
          --exclude-module psutil --exclude-module setuptools
          --exclude-module pip --exclude-module pytest
          --exclude-module unittest --exclude-module pydoc
          --exclude-module doctest --exclude-module lib2to3
          --exclude-module pdb --exclude-module tkinter.test
          relogio_vivo.py

      - uses: actions/upload-artifact@v4
        with:
          name: RelogioVivo-win-x64
          path: dist/RelogioVivo-win-x64.exe
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python, Tk e dependências de build
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-tk

      - name: Compilar
        run: bash build_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: RelogioVivo-linux-x64
          path: dist/RelogioVivo-linux-*
          if-no-files-found: error

  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar
        run: bash build_macos.sh

      - name: Empacotar .app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent RelogioVivo.app RelogioVivo-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RelogioVivo-macos-arm64
          path: dist/RelogioVivo-macos-arm64.zip
          if-no-files-found: error

  macos-intel:
    name: macOS (Intel)
    runs-on: macos-15-intel
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar
        run: bash build_macos.sh

      - name: Empacotar .app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent RelogioVivo.app RelogioVivo-macos-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RelogioVivo-macos-x64
          path: dist/RelogioVivo-macos-x64.zip
          if-no-files-found: error

  release:
    name: Publicar na release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/RelogioVivo-win-x64/RelogioVivo-win-x64.exe
            artifacts/RelogioVivo-linux-x64/RelogioVivo-linux-*
            artifacts/RelogioVivo-macos-arm64/RelogioVivo-macos-arm64.zip
          fail_on_unmatched_files: false
